<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="lib.title">🎮 Game Library</title>
  <meta name="description" data-i18n-content="meta.lib" content="Browse all NES games with play guides." />
  <link rel="stylesheet" href="style.css?v=20261008" />
  <style>
    .lib { max-width: 1000px; margin: 0 auto; padding: 16px 20px; }
    .lib-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .lib-top input {
      flex: 1; min-width: 180px;
      background: #0f1319; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 13px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .card:hover { border-color: var(--accent); }
    .card .t { font-weight: 600; font-size: 15px; }
    .card .d { font-size: 12px; color: var(--muted); flex: 1; }
    .card .f { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
    .card-row { display: flex; gap: 8px; }
    .card-row button { flex: 1; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand"><h1 data-i18n="lib.title">🎮 Game Library</h1></a>
    <p data-i18n="lib.sub">Click Play to jump back to the emulator and auto-load.</p>
    <span class="lang-select-wrap">
      <select id="source-select" data-sourceselect aria-label="ROM source">
        <option value="github">GitHub</option>
        <option value="jsdelivr">jsDelivr</option>
        <option value="gitee">Gitee</option>
      </select>
      <select id="lang-select" data-langselect aria-label="Language">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </span>
  </header>

  <div class="lib">
    <div class="lib-top panel">
      <a href="index.html" style="text-decoration:none"><button data-i18n="lib.back">← Back to Emulator</button></a>
      <input id="search" type="search" data-i18n-ph="lib.searchPh" placeholder="Search games…" />
      <span id="count" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="status" style="margin-bottom:10px" data-i18n="lib.loading">Loading…</div>
    <div class="grid" id="all-games"></div>
    <!-- Google AdSense: paste your ad unit code here after approval -->
  </div>

  <footer class="sitenav">
    <a href="games.html" data-i18n="nav.games">Games</a>
    <a href="about.html" data-i18n="nav.about">About</a>
    <a href="contact.html" data-i18n="nav.contact">Contact</a>
    <a href="privacy.html" data-i18n="nav.privacy">Privacy Policy</a>
  </footer>

  <script src="i18n.js?v=20261008"></script>
  <script>
    (function () {
      "use strict";
      var grid = document.getElementById("all-games");
      var statusEl = document.getElementById("status");
      var searchEl = document.getElementById("search");
      var countEl = document.getElementById("count");
      var games = [];

      function pageParams(id) {
        var lang = window.__getLang ? window.__getLang() : "en";
        var source = window.__getSource ? window.__getSource() : "github";
        return "?game=" + encodeURIComponent(id) + "&lang=" + lang + "&source=" + source;
      }

      function titleOf(g) {
        return window.__gameTitle ? window.__gameTitle(g) : g.title;
      }

      function descOf(g) {
        return window.__gameDesc ? window.__gameDesc(g) : g.desc_en || g.desc || g.file;
      }

      function render() {
        var filter = searchEl.value;
        grid.innerHTML = "";
        var kw = (filter || "").trim().toLowerCase();
        var shown = 0;
        games.forEach(function (g) {
          var hay = (g.title + " " + (g.title_zh || "") + " " + descOf(g) + " " + g.file).toLowerCase();
          if (kw && hay.indexOf(kw) < 0) return;
          shown++;
          var card = document.createElement("div");
          card.className = "card";
          var t = document.createElement("div");
          t.className = "t";
          t.textContent = titleOf(g);
          var d = document.createElement("div");
          d.className = "d";
          d.textContent = descOf(g);
          var f = document.createElement("div");
          f.className = "f";
          f.textContent = g.file;
          var btn = document.createElement("button");
          btn.className = "primary";
          btn.textContent = window.__t ? window.__t("lib.play") : "Play";
          btn.addEventListener("click", function () {
            window.location.href = "index.html" + pageParams(g.id);
          });
          var gdb = document.createElement("button");
          gdb.textContent = window.__t ? window.__t("guide.link") : "Guide";
          gdb.addEventListener("click", function () {
            window.location.href = "guide.html" + pageParams(g.id);
          });
          var row = document.createElement("div");
          row.className = "card-row";
          row.appendChild(btn);
          row.appendChild(gdb);
          card.appendChild(t);
          card.appendChild(d);
          card.appendChild(f);
          card.appendChild(row);
          grid.appendChild(card);
        });
        var total = window.__t ? window.__t("lib.total", { n: games.length }) : games.length + " games";
        var matched = kw && window.__t ? window.__t("lib.matched", { n: shown }) : "";
        countEl.textContent = total + matched;
        if (shown === 0) statusEl.textContent = window.__t ? window.__t("lib.none") : "No matching games";
        else statusEl.textContent = "";
      }

      searchEl.addEventListener("input", render);
      window.__onLangChange = render;

      fetch("games.json", { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          games = data;
          render();
        })
        .catch(function (e) {
          statusEl.textContent = (window.__t ? window.__t("lib.fail") : "Failed to load game list: ") + e.message;
          statusEl.className = "error";
        });
    })();
  </script>
</body>
</html>

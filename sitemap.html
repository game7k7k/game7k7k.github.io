  <script>
    (function () {
      "use strict";
      var list = document.getElementById("smap-guides");
      function withLang(url) {
        var lang = window.__getLang ? window.__getLang() : "en";
        var source = window.__getSource ? window.__getSource() : "github";
        return url + "&lang=" + lang + "&source=" + source;
      }
      function render(games) {
        list.innerHTML = "";
        games.forEach(function (g) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = withLang("guide.html?game=" + encodeURIComponent(g.id));
          a.textContent = window.__gameTitle ? window.__gameTitle(g) : g.title;
          li.appendChild(a);
          var f = document.createElement("span");
          f.className = "f";
          f.textContent = g.file;
          li.appendChild(f);
          list.appendChild(li);
        });
      }
      window.__onLangChange = function () {
        if (window.__lastGames) render(window.__lastGames);
      };
      fetch("games.json", { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("games.json HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          window.__lastGames = data;
          render(data);
        })
        .catch(function () {
          /* noscript fallback already lists guides */
        });
    })();

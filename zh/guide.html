  <script src="../i18n.js?v=20261011-5"></script>
  <script>
    (function () {
      "use strict";
      var titleEl = document.getElementById("g-title");
      var metaEl = document.getElementById("g-meta");
      var bodyEl = document.getElementById("g-body");
      var playBtn = document.getElementById("g-play");
      var prevBtn = document.getElementById("g-prev");
      var nextBtn = document.getElementById("g-next");
      var relatedEl = document.getElementById("g-related");
      var games = [];
      var guides = {};
      var currentId = null;
      function setLDJSON(id, data) {
        try {
          var old = document.getElementById(id);
          if (old && old.parentNode) old.parentNode.removeChild(old);
          var s = document.createElement("script");
          s.type = "application/ld+json";
          s.id = id;
          s.textContent = JSON.stringify(data);
          document.head.appendChild(s);
        } catch (e) {
          /* noop */
        }
      }


      function qs(name) {
        try {
          return new URL(window.location.href).searchParams.get(name);
        } catch (e) {
          return null;
        }
      }
      function withSource(url) {
        var sep = url.indexOf("?") < 0 ? "?" : "&";
        var source = window.__getSource ? window.__getSource() : "github";
        return url + sep + "source=" + source;
      }
      function titleOf(g) {
        return window.__gameTitle ? window.__gameTitle(g) : g.title;
      }

      function render() {
        var g = null;
        for (var i = 0; i < games.length; i++) {
          if (games[i].id === currentId) g = games[i];
        }
        var gd = guides[currentId];
        if (!g || !gd) {
          titleEl.textContent = window.__t ? window.__t("guide.notfound") : "Guide not found.";
          metaEl.textContent = "";
          bodyEl.innerHTML = "";
          document.title = window.__t ? window.__t("guide.notfound") : "Guide not found.";
          return;
        }
        var zh = (window.__getLang ? window.__getLang() : "en") === "zh";
        titleEl.textContent = titleOf(g) + " - " + (window.__t ? window.__t("guide.titleSuffix") : "Guide");
        document.title = titleEl.textContent;
        metaEl.textContent = (zh ? gd.genre : gd.genre_en) + " • " + g.file;
        bodyEl.innerHTML = "";
        gd.sections.forEach(function (s) {
          var h = document.createElement("h2");
          h.textContent = zh ? s.h : s.h_en;
          bodyEl.appendChild(h);
          (zh ? s.p : s.p_en).forEach(function (para) {
            var p = document.createElement("p");
            p.textContent = para;
            bodyEl.appendChild(p);
          });
        });
        try {
          var canonUrl = "https://game7k7k.github.io/guide.html?game=" + encodeURIComponent(g.id);
          var can = document.querySelector('link[rel="canonical"]');
          if (can) can.setAttribute("href", canonUrl);
          setLDJSON("ld-guide", {
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Article",
                headline: g.title + " Guide",
                description: g.desc_en || g.desc,
                inLanguage: zh ? "zh-CN" : "en",
                author: { "@type": "Organization", name: "game7k7k" },
                mainEntityOfPage: canonUrl
              },
              {
                "@type": "BreadcrumbList",
                itemListElement: [
                  { "@type": "ListItem", position: 1, name: "Home", item: "https://game7k7k.github.io/" },
                  { "@type": "ListItem", position: 2, name: "Games", item: "https://game7k7k.github.io/games.html" },
                  { "@type": "ListItem", position: 3, name: g.title, item: canonUrl }
                ]
              }
            ]
          });
        } catch (e) {
          /* noop */
        }
        playBtn.onclick = function () {
          window.location.href = withSource("index.html?game=" + encodeURIComponent(g.id));
        };
        var idx = games.indexOf(g);
        var prev = games[(idx - 1 + games.length) % games.length];
        var next = games[(idx + 1) % games.length];
        prevBtn.onclick = function () {
          window.location.href = withSource("guide.html?game=" + encodeURIComponent(prev.id));
        };
        nextBtn.onclick = function () {
          window.location.href = withSource("guide.html?game=" + encodeURIComponent(next.id));
        };
        relatedEl.innerHTML = "";
        games.forEach(function (o) {
          if (o.id === g.id) return;
          var a = document.createElement("button");
          a.textContent = titleOf(o);
          a.addEventListener("click", function () {
            window.location.href = withSource("guide.html?game=" + encodeURIComponent(o.id));
          });
          relatedEl.appendChild(a);
        });
      }

      currentId = qs("game");
      Promise.all([
        fetch((window.__asset ? window.__asset() : "") + "games.json", { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("games.json HTTP " + r.status);
          return r.json();
        }),
        fetch((window.__asset ? window.__asset() : "") + "guides.json", { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("guides.json HTTP " + r.status);
          return r.json();
        })
      ])
        .then(function (res) {
          games = res[0];
          res[1].forEach(function (gd) {
            guides[gd.id] = gd;
          });
          render();
        })
        .catch(function (e) {
          titleEl.textContent = String((window.__t ? window.__t("guide.notfound") : "Guide not found.") + " (" + e.message + ")");
        });
    })();
  </script>
